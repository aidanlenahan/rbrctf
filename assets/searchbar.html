<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Searchbar</title>
  <style>
    :root{
      --bg:#0b0b0d;
      --card:#071018;
      --fg:#e6f3ff;
      --pad:20px;
      --mono: "Courier New", monospace;
    }
    html,body{
      height:100%;
      margin:0;
      background:var(--bg);
      display:flex;
      align-items:center;
      justify-content:center;
      font-family:var(--mono);
      color:var(--fg);
    }
    .card{
      background: linear-gradient(180deg,var(--card) 0%, #0d1b24 100%);
      padding:var(--pad);
      border-radius:10px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      border:1px solid rgba(255,255,255,0.03);
      max-width: 95vw;
      overflow:auto;
    }
    pre {
      margin:0;
      white-space: pre;
      line-height: 12px;
      font-size: 12px;
    }
    @media (max-width:640px){
      pre { font-size:10px; line-height:10px; }
    }
  </style>
</head>
<body>
  <div class="card" role="img" aria-label="Obfuscated ASCII art (reconstructed in browser)">
    <pre id="art"></pre>
  </div>

<script>


const scrambled = [
  { idx: 7, s: "IC8gXyBcfCB8IHwgfCB8LyBfYCB8X19fX198IHxfICB8IFwgXC8gL19fX198IHwgfCAnXyBcfCAvIF9ffCB8ICAgICAgICAgICAg" },
  { idx: 3, s: "fCB8ICB8IHxfKSB8IHwgPCA8IHwgfCAgfCB8IChffCB8IHxffCB8IHxfKSB8ICBfXy9fX19fX3wgfF9fX19ffF9fKSB8IHwgfCB8" },
  { idx: 2, s: "fCAnX198ICdfIFx8ICdfX3wgfHwgfFwvfCB8LyBfYCB8IHwgfCB8ICdfIFwgLyBfIFxfX19fX3wgfF9fX19cX19fIFx8ICdfIFwg" },
  { idx: 8, s: "fCAoXykgfCB8X3wgfCB8IChffCB8X19fX198ICBffCB8IHw+ICA8X19fX198IHwgfCB8IHwgfCBcX18gXD4gPiAgICAgICAgICAg" },
  { idx: 5, s: "ICAgICAgICAgICAgIF8gICBcX1wgICAgICAgX19fX18gfF9fXy8gICAgIF9fX19fIF8gICAgIF8gICBfXyAgICAgICAgICAgICAg" },
  { idx: 6, s: "ICBfX18gIF8gICBffCB8IF9ffCB8ICAgICB8ICBfX18oXylfICBfXyAgfF8gICBffCB8X18gKF8pX19cIFwgICAgICAgICAgICAg" },
  { idx: 9, s: "IFxfX18vIFxfXyxffF98XF9fLF98ICAgICB8X3wgICB8Xy9fL1xfXCAgICB8X3wgfF98IHxffF98X19fLyB8ICAgICAgICAgICAg" },
  { idx: 4, s: "fF98ICB8Xy5fXy98X3wgIHwgfHxffCAgfF98XF9fLF98XF9fLCB8Xy5fXy8gXF9fX3wgICAgfF9fX3wgICB8X19fXy98X3wgfF98" },
  { idx: 0, s: "ICAgICAgXyAgICAgICAgICAgX19fXyAgX18gICAgICAgICAgICAgXyAgICAgICAgICAgICAgIF9fXyAgICAgX19fXyAgXyAgICAg" },
  { idx: 1, s: "IF8gX198IHxfXyAgXyBfXyAvIC8gIFwvICB8IF9fIF8gXyAgIF98IHxfXyAgIF9fXyAgICAgfF8gX3wgICAvIF9fX3x8IHxfXyAg" },
  { idx: 10, s: "ICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAvXy8gICAgICAgICAgICAg" }
];

// decode base64 safely (utf-8)
function b64decodeUtf8(b64) {
  try {
    // atob returns binary string; decode percent-encoding for utf-8 safety
    return decodeURIComponent(Array.prototype.map.call(atob(b64), function(c){
      return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
    }).join(''));
  } catch (e) {
    // fallback for browsers/environments that might not support decodeURIComponent trick
    return atob(b64);
  }
}

// reconstruct: decode, sort by idx, join with newline, then render
const reconstructed = scrambled
  .map(item => ({ idx: item.idx, line: b64decodeUtf8(item.s) }))
  .sort((a,b) => a.idx - b.idx)
  .map(o => o.line)
  .join("\n");

document.getElementById("art").textContent = reconstructed;
</script>
</body>
</html>
