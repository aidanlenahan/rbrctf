<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RBR CTF</title>
  <link rel="shortcut icon" href="../images/pic01.jpg" type="image/x-icon">
  
  <!-- Bootstrap CSS from CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <!-- Font Awesome from CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      --theme-color: #621818;
    }
    
    .navbar {
      background-color: var(--theme-color) !important;
    }
    
    .jumbotron {
      background-color: var(--theme-color) !important;
      color: white;
      padding: 4rem 1rem;
      margin-bottom: 2rem;
      text-align: center;
    }
    
    .jumbotron h1 {
      font-size: 3.5rem;
      font-weight: bold;
      margin-bottom: 1rem;
    }
    
    .jumbotron p {
      font-size: 1.25rem;
      margin-bottom: 2rem;
    }
    
    .footer {
      margin-top: 3rem;
      padding: 2rem 0;
      background-color: #f8f9fa;
      text-align: center;
    }
    
    body {
      padding-top: 56px;
    }
    
    .btn-primary {
      background-color: var(--theme-color);
      border-color: var(--theme-color);
    }
    
    .btn-primary:hover {
      background-color: #4a1212;
      border-color: #4a1212;
    }
    
    .card {
      transition: transform 0.3s ease;
      height: 100%;
    }
    
    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 5px 15px rgba(0,0,0,0.3);
    }
    
    .stats-section {
      background-color: #f8f9fa;
      padding: 3rem 0;
    }
    
    .stat-card {
      text-align: center;
      padding: 2rem;
    }
    
    .stat-card h2 {
      font-size: 3rem;
      font-weight: bold;
      color: var(--theme-color);
      margin-bottom: 0.5rem;
    }
    
    .stat-card p {
      font-size: 1.1rem;
      color: #6c757d;
      margin: 0;
    }
    
    .info-section {
      padding: 3rem 0;
    }
    
    .info-section h2 {
      margin-bottom: 2rem;
      font-weight: bold;
    }
    
    .feature-icon {
      font-size: 3rem;
      color: var(--theme-color);
      margin-bottom: 1rem;
    }
  </style>
</head>
<body>
  <!-- Navigation -->
  <nav class="navbar navbar-expand-md navbar-dark bg-dark fixed-top">
    <div class="container">
      <a href="index.html" class="navbar-brand">
        <span style="font-weight: bold;">RBR CTF</span>
      </a>

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#base-navbars"
              aria-controls="base-navbars" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="base-navbars">
        <ul class="navbar-nav me-auto">
          <li class="nav-item">
            <a class="nav-link" href="#">Help</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="scoreboard.html">Scoreboard</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="challenges.html">Challenges</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="submit.html">Submit</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <main role="main">
    <!-- Hero Section -->
    <div class="jumbotron">
      <div class="container">
        <h1>RBR CTF</h1>
        <p class="lead">Test your cybersecurity skills and compete with the best</p>
        <div class="mt-4">
          <a href="challenges.html" class="btn btn-primary btn-lg me-2">
            <i class="fas fa-flag pe-2"></i>View Challenges
          </a>
          <!--<a href="#about" class="btn btn-outline-light btn-lg">
            <i class="fas fa-info-circle pe-2"></i>Learn More
          </a> -->
        </div>
      </div>
    </div>

    <!-- Stats Section -->
    <div class="stats-section">
      <div class="container">
        <div class="row justify-content-center">
          <div class="col-md-4">
            <div class="stat-card">
              <h2><span id="challengeCount">...</span></h2>
              <p>Challenges</p>
            </div>
          </div>
          <div class="col-md-4">
            <div class="stat-card">
              <h2><span id="categoryCount">...</span></h2>
              <p>Categories</p>
            </div>
          </div>
        </div>
      </div>
    </div>

    
    <!-- Call to Action -->
    <div class="info-section">
      <div class="container text-center">
        <h2 class="mb-4">Ready to Start?</h2>
        <p class="lead mb-4">Join the competition and prove your skills!</p>
        <a href="challenges.html" class="btn btn-primary btn-lg">
          <i class="fas fa-flag pe-2"></i>Browse Challenges
        </a>
      </div>
    </div>
  </main>

 

  <!-- Bootstrap JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  
  <script>
    // Load challenges data and update stats
    async function loadStats() {
      try {
        const response = await fetch('challenges.json');
        const challengesData = await response.json();
        
        // Count total challenges
        let totalChallenges = 0;
        Object.keys(challengesData).forEach(category => {
          totalChallenges += challengesData[category].length;
        });
        
        // Count categories
        const categoryCount = Object.keys(challengesData).length;
        
        // Update DOM
        document.getElementById('challengeCount').textContent = totalChallenges;
        document.getElementById('categoryCount').textContent = categoryCount;
      } catch (error) {
        console.error('Error loading stats:', error);
        document.getElementById('challengeCount').textContent = '0';
        document.getElementById('categoryCount').textContent = '0';
      }
    }

    // Optional: Add animation to stats on scroll
    document.addEventListener('DOMContentLoaded', function() {
      // Load stats from JSON
      loadStats();
      
      const statCards = document.querySelectorAll('.stat-card h2');
      
      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            entry.target.style.opacity = '1';
            entry.target.style.transform = 'scale(1)';
          }
        });
      });
      
      statCards.forEach(card => {
        card.style.opacity = '0';
        card.style.transform = 'scale(0.8)';
        card.style.transition = 'all 0.5s ease';
        observer.observe(card);
      });
    });
  </script>
</body>
</html>
