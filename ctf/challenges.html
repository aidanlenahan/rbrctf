<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Challenges - RBR CTF</title>
  <link rel="icon" type="image/svg+xml" href="../images/favicon.svg" />
  
  <!-- Bootstrap CSS from CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <!-- Font Awesome from CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      --theme-color: #621818;
    }
    
    .navbar {
      background-color: var(--theme-color) !important;
    }
    
    .jumbotron {
      background-color: var(--theme-color) !important;
      color: white;
      padding: 2rem 1rem;
      margin-bottom: 0.5rem;
    }
    
    .note-text {
      font-size: 0.85rem;
      font-style: italic;
      color: #666;
      text-align: center;
      margin-bottom: 0.5rem;
    }
    
    .category-header h3 {
      font-weight: bold;
      border-bottom: 2px solid #dee2e6;
      padding-bottom: 0.5rem;
    }
    
    .challenge-button {
      min-height: 120px;
      position: relative;
      transition: all 0.3s ease;
      border: 2px solid #495057;
    }
    
    .challenge-button:hover {
      transform: translateY(-5px);
      box-shadow: 0 5px 15px rgba(0,0,0,0.3);
    }
    
    .challenge-button.challenge-solved {
      background-color: #28a745 !important;
      border-color: #28a745 !important;
    }
    
    .challenge-button.challenge-solved:hover {
      background-color: #218838 !important;
    }
    
    .challenge-inner p {
      font-weight: bold;
      font-size: 1.1rem;
      margin-bottom: 0.5rem;
    }
    
    .challenge-inner span {
      display: inline-block;
      padding: 0.25rem 0.75rem;
      background-color: rgba(255, 255, 255, 0.2);
      border-radius: 0.25rem;
      font-weight: bold;
    }
    
    .footer {
      margin-top: 3rem;
      padding: 2rem 0;
      background-color: #f8f9fa;
      text-align: center;
    }
    
    .spinner {
      color: var(--theme-color);
    }
    
    .min-vh-50 {
      min-height: 50vh;
    }
    
    body {
      padding-top: 56px;
    }
    
    .challenge-tag {
      display: inline-block;
      padding: 0.2rem 0.5rem;
      margin: 0.2rem;
      background-color: #6c757d;
      color: white;
      border-radius: 0.25rem;
      font-size: 0.75rem;
    }
  </style>
</head>
<body>
  <!-- Navigation -->
  <nav class="navbar navbar-expand-md navbar-dark bg-dark fixed-top">
    <div class="container">
      <a href="index.html" class="navbar-brand">
        <span style="font-weight: bold;">RBR CTF</span>
      </a>

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#base-navbars"
              aria-controls="base-navbars" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="base-navbars">
        <ul class="navbar-nav me-auto">
          <li class="nav-item">
            <a class="nav-link" href="#">Help</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="scoreboard.html">Scoreboard</a>
          </li>
          <li class="nav-item">
            <a class="nav-link active" href="challenges.html">Challenges</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="submit.html">Submit</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <main role="main">
    <!-- Header -->
    <div class="jumbotron">
      <div class="container">
        <h1>Challenges</h1>
      </div>
    </div>

    <p class="note-text"><em>To submit a flag to any question, please see the <a href="submit.html">Submit page</a>.</em></p>

    <div class="container" id="challenges-container">
      <!-- Challenges will be generated dynamically from JSON -->
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <div class="container text-center">
      <a href="https://rbrhs.org" class="text-secondary">
        <small class="text-muted">Powered by RBR</small>
      </a>
    </div>
  </footer>

  <!-- Challenge Modal -->
  <div class="modal fade" id="challengeModal" tabindex="-1" aria-labelledby="challengeModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="challengeModalLabel">Challenge Name</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <div id="challengeDescription">
            <p>Challenge description will appear here...</p>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  
  <script>
    let challengesData = {};

    // Load challenges from JSON file
    async function loadChallenges() {
      try {
        const response = await fetch('challenges.json');
        challengesData = await response.json();
        generateChallenges();
      } catch (error) {
        console.error('Error loading challenges:', error);
        document.getElementById('challenges-container').innerHTML = 
          '<div class="alert alert-danger">Error loading challenges. Please try again later.</div>';
      }
    }

    // Generate challenges dynamically
    function generateChallenges() {
      const container = document.getElementById('challenges-container');
      container.innerHTML = '';
      
      Object.keys(challengesData).forEach(category => {
        const categoryDiv = document.createElement('div');
        categoryDiv.className = 'pt-5';
        
        const categoryHeader = document.createElement('div');
        categoryHeader.className = 'category-header mb-3';
        categoryHeader.innerHTML = `<h3>${category}</h3>`;
        
        const challengesRow = document.createElement('div');
        challengesRow.className = 'challenges-row row';
        
        challengesData[category].forEach(challenge => {
          const challengeCol = document.createElement('div');
          challengeCol.className = 'col-sm-6 col-md-4 col-lg-3 my-3';
          
          const solvedClass = challenge.solved ? 'challenge-solved' : '';
          challengeCol.innerHTML = `
            <button class="challenge-button btn btn-dark w-100 h-100 ${solvedClass}" 
                    onclick="openChallenge('${category}', '${challenge.name}')">
              <div class="challenge-inner my-3">
                <p>${challenge.name}</p>
                <span>${challenge.points}</span>
              </div>
            </button>
          `;
          
          challengesRow.appendChild(challengeCol);
        });
        
        categoryDiv.appendChild(categoryHeader);
        categoryDiv.appendChild(challengesRow);
        container.appendChild(categoryDiv);
      });
    }

    function openChallenge(category, challengeName) {
      const challenge = challengesData[category].find(c => c.name === challengeName);
      
      if (challenge) {
        document.getElementById('challengeModalLabel').textContent = challenge.name;
        document.getElementById('challengeDescription').innerHTML = challenge.description;
        
        const modal = new bootstrap.Modal(document.getElementById('challengeModal'));
        modal.show();
      }
    }

    // Load challenges when page loads
    document.addEventListener('DOMContentLoaded', loadChallenges);
  </script>

  <!-- Footer -->
  <footer style="text-align: center; padding: 20px 0; margin-top: 40px;">
    <a href="../index.html" style="color: #888; text-decoration: none; font-size: 14px;">Back to Hard Hats Inc.</a>
  </footer>
</body>
</html>
